<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dice Golf Map Generator</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="game-container">
      <div id="map-container"></div>
      <div id="text-container">
        <span class="text-hole">Hole: 1</span>
        <span class="text-strokes">Strokes: /5</span>
        <span class="text-total">Total:</span>
      </div>
    </div>
    <script src="script.js"></script>
    <script>
      const TILE_SIZE = 30;
      const MAP_WIDTH = 16; // in tile count
      const MAP_HEIGHT = 26; // in tile count

      function createTile(type, content = "", rotation = 0) {
        const tile = document.createElement("div");
        tile.className = `tile ${type}`;
        if (content) {
          tile.innerHTML = content;
        }
        if (rotation !== 0) {
          tile.style.transform = `rotate(${rotation}deg)`;
        }
        return tile;
      }

      function createTreeSVG() {
        const triangle = (pos) => `
          <path d="M 20,
            ${pos} L 10,
            ${pos + 13} L 30,
            ${pos + 13} Z" 
          stroke-linejoin="round" stroke-width="3"/>
        `;

        return `
          <svg viewBox="0 0 40 40" class="tree-svg" fill="currentColor" stroke="currentColor">
            ${triangle(8)}
            ${triangle(18)}
          </svg>
        `;
      }

      function createRockSVG() {
        return `
          <svg viewBox="0 0 40 40" class="rock-svg">
            <circle cx="20" cy="20" r="8" fill="#888"/>
          </svg>
        `;
      }

      function createBushSVG() {
        return `
          <svg viewBox="0 0 40 40" class="bush-svg">
            <circle cx="15" cy="20" r="8" fill="#4a7c4a"/>
            <circle cx="25" cy="20" r="8" fill="#4a7c4a"/>
            <circle cx="20" cy="15" r="8" fill="#4a7c4a"/>
          </svg>
        `;
      }

      function createBallSVG() {
        return `
          <svg viewBox="0 0 40 40" class="ball-svg">
            <circle cx="20" cy="20" r="6" fill="white" stroke="#333" stroke-width="1"/>
          </svg>
        `;
      }

      function createHoleSVG() {
        return `
          <svg viewBox="0 0 40 40" class="hole-svg">
            <circle cx="20" cy="20" r="5" fill="#000"/>
            <line x1="20" y1="4" x2="20" y2="20" stroke="#000" stroke-width="1.5"/>
            <polygon points="20,4 18,8 22,8" fill="red"/>
          </svg>
        `;
      }

      function drawMap({ map, rotations }) {
        const container = document.getElementById("map-container");
        container.innerHTML = ""; // Clear previous content before drawing
        container.style.gridTemplateColumns = `repeat(${MAP_WIDTH}, ${TILE_SIZE}px)`;
        container.style.gridTemplateRows = `repeat(${MAP_HEIGHT}, ${TILE_SIZE}px)`;

        // Create tiles
        for (let y = 0; y < map.length; y++) {
          for (let x = 0; x < map[0].length; x++) {
            const terrainValue = map[y][x];
            const rotation = rotations ? rotations[y][x] : 0;
            let tileType;

            // Determine terrain type
            // 0 = rough, 1 = fairway, 2 = sand, 3 = water, 4 = tree, 5 = ball, 6 = hole, 7 = arrow
            switch (terrainValue) {
              case 1:
                tileType = "fairway";
                break;
              case 2:
                tileType = "sand";
                break;
              case 3:
                tileType = "water";
                break;
              case 4:
                tileType = "tree";
                break;
              case 5:
                tileType = "ball";
                break;
              case 6:
                tileType = "hole";
                break;
              case 7:
                tileType = "arrow";
                break;
              default:
                tileType = "rough";
            }

            const tile = createTile(tileType, "", rotation);
            container.appendChild(tile);
          }
        }
      }

      // Generate and draw
      drawMap(generateMap(MAP_WIDTH, MAP_HEIGHT));
    </script>
  </body>
</html>
