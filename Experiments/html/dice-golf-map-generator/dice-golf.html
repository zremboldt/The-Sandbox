<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dice Golf Map Generator</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="map-container"></div>
    <script src="script.js"></script>
    <script>
      const TILE_SIZE = 30;
      const MAP_WIDTH = 16; // in tile count
      const MAP_HEIGHT = 26; // in tile count

      function createTile(type, content = "") {
        const tile = document.createElement("div");
        tile.className = `tile ${type}`;
        if (content) {
          tile.innerHTML = content;
        }
        return tile;
      }

      function createTreeSVG() {
        const triangle = (pos) => `
          <path d="M 20,
            ${pos} L 10,
            ${pos + 13} L 30,
            ${pos + 13} Z" 
          stroke-linejoin="round" stroke-width="3"/>
        `;

        return `
          <svg viewBox="0 0 40 40" class="tree-svg" fill="currentColor" stroke="currentColor">
            ${triangle(8)}
            ${triangle(18)}
          </svg>
        `;
      }

      function createRockSVG() {
        return `
          <svg viewBox="0 0 40 40" class="rock-svg">
            <circle cx="20" cy="20" r="8" fill="#888"/>
          </svg>
        `;
      }

      function createBushSVG() {
        return `
          <svg viewBox="0 0 40 40" class="bush-svg">
            <circle cx="15" cy="20" r="8" fill="#4a7c4a"/>
            <circle cx="25" cy="20" r="8" fill="#4a7c4a"/>
            <circle cx="20" cy="15" r="8" fill="#4a7c4a"/>
          </svg>
        `;
      }

      function createFlowerSVG() {
        return `
          <svg viewBox="0 0 40 40" class="flower-svg">
            <circle cx="20" cy="20" r="4" fill="#ffeb3b"/>
            <circle cx="20" cy="15" r="3" fill="#e91e63"/>
            <circle cx="25" cy="20" r="3" fill="#e91e63"/>
            <circle cx="20" cy="25" r="3" fill="#e91e63"/>
            <circle cx="15" cy="20" r="3" fill="#e91e63"/>
          </svg>
        `;
      }

      function createSignSVG() {
        return `
          <svg viewBox="0 0 40 40" class="sign-svg">
            <rect x="17" y="15" width="6" height="20" fill="#5c4033"/>
            <rect x="10" y="10" width="20" height="10" rx="2" fill="#8b6f47"/>
          </svg>
        `;
      }

      function drawMap({ map, decorations }) {
        const container = document.getElementById("map-container");
        container.innerHTML = ""; // Clear previous content before drawing
        container.style.gridTemplateColumns = `repeat(${MAP_WIDTH}, ${TILE_SIZE}px)`;
        container.style.gridTemplateRows = `repeat(${MAP_HEIGHT}, ${TILE_SIZE}px)`;

        // Create a lookup for decorations
        const decorationMap = new Map();
        decorations.forEach((d) => decorationMap.set(`${d.x},${d.y}`, d));

        // Create tiles
        for (let y = 0; y < map.length; y++) {
          for (let x = 0; x < map[0].length; x++) {
            const isGrass = map[y][x] === 1;
            const key = `${x},${y}`;
            const decoration = decorationMap.get(key);

            let tile;
            if (decoration) {
              let svg = "";
              switch (decoration.type) {
                case "tree":
                  svg = createTreeSVG();
                  break;
                case "rock":
                  svg = createRockSVG();
                  break;
                case "bush":
                  svg = createBushSVG();
                  break;
                case "flower":
                  svg = createFlowerSVG();
                  break;
                case "sign":
                  svg = createSignSVG();
                  break;
              }
              tile = createTile("grass", svg);
            } else {
              tile = createTile(isGrass ? "grass" : "water");
            }

            container.appendChild(tile);
          }
        }
      }

      // Generate and draw
      drawMap(generateMap(MAP_WIDTH, MAP_HEIGHT));
    </script>
  </body>
</html>
