<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dice Golf</title>
    <link rel="icon" href="https://fav.farm/⛳" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="game-container">
      <div id="seed-label"></div>
      <div id="map-container"></div>
      <div id="text-container">
        <span class="text-hole">Hole:</span>
        <span class="text-strokes">Strokes:</span>
        <span class="text-total">Total:</span>
      </div>
    </div>
    <button id="new-map-btn">New map</button>
    <button id="screenshot-btn">Screenshot</button>
    <script src="https://cdn.jsdelivr.net/npm/dom-to-image-more@2.8.0/dist/dom-to-image-more.min.js"></script>
    <script src="script.js"></script>
    <script>
      const TILE_SIZE = 30;
      const MAP_WIDTH = 16; // in tile count
      const MAP_HEIGHT = 26; // in tile count
      const SCREENSHOT_SCALE = 4; // Screenshot output scale multiplier

      const createSandPattern = () => {
        // Create repeating diagonal lines
        const lines = [];
        const spacing = 10; // Spacing between diagonal lines (must divide evenly into TILE_SIZE)
        const repetitions = TILE_SIZE / spacing;
        for (let i = 0; i <= repetitions; i++) {
          for (let j = 0; j <= repetitions; j++) {
            const x = i * spacing;
            const y = j * spacing;
            lines.push(
              `<line x1="${x}" y1="${y + spacing}" x2="${
                x + spacing
              }" y2="${y}" stroke="#ccc" stroke-width="1"/>`
            );
          }
        }
        return lines.join("");
      };

      function createTile(type, content = "", rotation = 0) {
        const tile = document.createElement("div");
        tile.className = `tile ${type}`;

        // Add inline SVG for types that use background images
        if (type === "sand") {
          tile.innerHTML = `<svg width="${TILE_SIZE}" height="${TILE_SIZE}" xmlns="http://www.w3.org/2000/svg" style="position:absolute;top:0;left:0;">${createSandPattern()}</svg>`;
        } else if (type === "tree") {
          tile.innerHTML =
            '<svg viewBox="0 0 40 40" fill="#444" stroke="#444" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;position:absolute;top:0;left:0;"><path d="M 20,8 L 10,21 L 30,21 Z" stroke-linejoin="round" stroke-width="3"/><path d="M 20,18 L 10,31 L 30,31 Z" stroke-linejoin="round" stroke-width="3"/></svg>';
        } else if (type === "ball") {
          tile.innerHTML =
            '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;position:absolute;top:0;left:0;"><circle cx="20" cy="20" r="9" fill="white" stroke="#444" stroke-width="4"/></svg>';
        } else if (type === "hole") {
          tile.innerHTML =
            '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;position:absolute;top:0;left:0;"><circle cx="20" cy="20" r="11" fill="#444"/></svg>';
        } else if (type === "arrow") {
          tile.innerHTML =
            '<svg viewBox="0 0 40 40" fill="#444" stroke="#444" xmlns="http://www.w3.org/2000/svg" style="width:60%;height:60%;position:absolute;top:20%;left:20%;"><path d="M 20,13 L 10,26 L 30,26 Z" stroke-linejoin="round" stroke-width="3"/></svg>';
        } else if (content) {
          tile.innerHTML = content;
        }

        if (rotation !== 0) {
          tile.style.transform = `rotate(${rotation}deg)`;
        }
        return tile;
      }

      function drawMap({ map, rotations }) {
        const container = document.getElementById("map-container");
        container.innerHTML = ""; // Clear previous content before drawing
        container.style.gridTemplateColumns = `repeat(${MAP_WIDTH}, ${TILE_SIZE}px)`;
        container.style.gridTemplateRows = `repeat(${MAP_HEIGHT}, ${TILE_SIZE}px)`;

        // Create tiles
        for (let y = 0; y < map.length; y++) {
          for (let x = 0; x < map[0].length; x++) {
            const terrainValue = map[y][x];
            const rotation = rotations ? rotations[y][x] : 0;
            let tileType;

            // Determine terrain type
            // 0 = rough, 1 = fairway, 2 = sand, 3 = water, 4 = tree, 5 = ball, 6 = hole, 7 = arrow
            switch (terrainValue) {
              case 1:
                tileType = "fairway";
                break;
              case 2:
                tileType = "sand";
                break;
              case 3:
                tileType = "water";
                break;
              case 4:
                tileType = "tree";
                break;
              case 5:
                tileType = "ball";
                break;
              case 6:
                tileType = "hole";
                break;
              case 7:
                tileType = "arrow";
                break;
              default:
                tileType = "rough";
            }

            const tile = createTile(tileType, "", rotation);
            container.appendChild(tile);
          }
        }
      }

      // Generate and draw
      // Get seed and hole from URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const seedParam = urlParams.get("seed");
      const seed = seedParam ? parseInt(seedParam) : null;
      const holeParam = urlParams.get("hole");
      let holeNumber = holeParam ? parseInt(holeParam) : 1;

      const result = generateMap(MAP_WIDTH, MAP_HEIGHT, seed);
      drawMap(result);

      // Helper function to update URL with current parameters
      function updateURL() {
        const params = new URLSearchParams();
        params.set("seed", result.seed);
        params.set("hole", holeNumber);
        const newURL = `${window.location.pathname}?${params.toString()}`;
        window.history.replaceState({}, "", newURL);
      }

      // Display the seed on the page
      const seedLabel = document.getElementById("seed-label");
      seedLabel.textContent = `Seed: ${result.seed}`;

      // Add click handler to update hole number
      const holeLabel = document.querySelector(".text-hole");
      holeLabel.textContent = `Hole: ${holeNumber}`;
      holeLabel.style.cursor = "pointer";
      holeLabel.addEventListener("click", () => {
        holeNumber = (holeNumber % 18) + 1; // Cycle from 1 to 18
        holeLabel.textContent = `Hole: ${holeNumber}`;
        updateURL();
      });

      // Add click handler to new map button
      const newMapBtn = document.getElementById("new-map-btn");
      newMapBtn.addEventListener("click", () => {
        const newSeed = Math.floor(Math.random() * 1000000);
        window.location.href = `${window.location.pathname}?seed=${newSeed}&hole=${holeNumber}`;
      });

      // Add click handler to screenshot button
      const screenshotBtn = document.getElementById("screenshot-btn");
      screenshotBtn.addEventListener("click", async () => {
        const gameContainer = document.getElementById("game-container");
        const originalText = screenshotBtn.textContent;

        screenshotBtn.textContent = "Generating...";

        try {
          // Allow UI to update before starting heavy operation (allows "Generating..." to show)
          await new Promise((resolve) => setTimeout(resolve, 0));

          // Use dom-to-image-more to capture the game-container (better SVG support)
          const blob = await domtoimage.toBlob(gameContainer, {
            bgcolor: "#ffffff",
            width: gameContainer.offsetWidth * SCREENSHOT_SCALE,
            height: gameContainer.offsetHeight * SCREENSHOT_SCALE,
            style: {
              transform: `scale(${SCREENSHOT_SCALE})`,
              transformOrigin: "top left",
              width: gameContainer.offsetWidth + "px",
              height: gameContainer.offsetHeight + "px",
            },
          });

          // Convert blob to download link
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = `dice-golf-hole-${holeNumber}-seed-${result.seed}.png`;
          link.click();
          URL.revokeObjectURL(url);

          screenshotBtn.textContent = "Downloaded!";
          setTimeout(() => {
            screenshotBtn.textContent = originalText;
          }, 1500);
        } catch (err) {
          console.error("Failed to capture screenshot:", err);
          screenshotBtn.textContent = "Error!";
          setTimeout(() => {
            screenshotBtn.textContent = originalText;
          }, 1500);
        }
      });

      // Set initial URL with parameters
      updateURL();
    </script>
  </body>
</html>
