<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inkhold</title>
    <link rel="icon" href="https://fav.farm/🏰" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="game-container">
      <div id="seed-label"></div>
      <div id="map-container"></div>
      <!-- <div id="text-container">
        <span class="text-hole">Hole:</span>
        <span class="text-strokes">Strokes:</span>
        <span class="text-total">Total:</span>
      </div> -->
    </div>
    <button id="new-map-btn">New map</button>
    <button id="screenshot-btn">Screenshot</button>
    <script src="https://cdn.jsdelivr.net/npm/dom-to-image-more@2.8.0/dist/dom-to-image-more.min.js"></script>
    <script src="script.js"></script>
    <script>
      const TILE_SIZE = 60;
      const MAP_WIDTH = 11; // in tile count
      const MAP_HEIGHT = 11; // in tile count
      const SCREENSHOT_SCALE = 4; // Screenshot output scale multiplier

      const createMountainPattern = () => {
        // Create diagonal lines
        const lines = [];
        const spacing = 12; // Spacing between diagonal lines
        const repetitions = Math.ceil(TILE_SIZE / spacing) + 1;
        const color = "#888";
        const strokeWidth = 2;

        for (let i = 0; i <= repetitions; i++) {
          const offset = i * spacing;
          lines.push(
            `<line x1="0" y1="${offset}" x2="${offset}" y2="0" stroke="${color}" stroke-width="${strokeWidth}"/>`
          );
          if (offset < TILE_SIZE) {
            lines.push(
              `<line x1="${
                TILE_SIZE - offset
              }" y1="${TILE_SIZE}" x2="${TILE_SIZE}" y2="${
                TILE_SIZE - offset
              }" stroke="${color}" stroke-width="${strokeWidth}"/>`
            );
          }
        }

        return lines.join("");
      };

      function createTile(type, content = "", rotation = 0) {
        const tile = document.createElement("div");
        tile.className = `tile ${type}`;

        // Add inline SVG for types that use background images
        if (type === "mountains") {
          tile.innerHTML = `
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="${TILE_SIZE - 10}" 
              height="${TILE_SIZE - 10}"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m8 3 4 8 5-5 5 15H2L8 3z"/>
              <path d="M4.14 15.08c2.62-1.57 5.24-1.43 7.86.42 2.74 1.94 5.49 2 8.23.19"/>
            </svg>
          `;
        } else if (type === "ruins") {
          tile.innerHTML = `
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="${TILE_SIZE}"
              height="${TILE_SIZE}"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M5 3a2 2 0 0 0-2 2"/>
              <path d="M19 3a2 2 0 0 1 2 2"/>
              <path d="M21 19a2 2 0 0 1-2 2"/>
              <path d="M5 21a2 2 0 0 1-2-2"/>
              <path d="M9 3h1"/>
              <path d="M9 21h1"/>
              <path d="M14 3h1"/>
              <path d="M14 21h1"/>
              <path d="M3 9v1"/>
              <path d="M21 9v1"/>
              <path d="M3 14v1"/>
              <path d="M21 14v1"/>
            </svg>
          `;
        } else if (type === "river") {
          const viewBoxHeight = 24;
          const waveSpacing = viewBoxHeight / 5;

          const generateWaves = () => {
            let waves = "";
            for (let i = 0; i < 4; i++) {
              waves += `
                <path d="M2 ${
                  waveSpacing * (i + 1)
                }c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/>
              `;
            }
            return waves;
          };

          tile.innerHTML = `
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="${TILE_SIZE}"
              height="${TILE_SIZE}"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              ${generateWaves()}
            </svg>
          `;
        } else if (content) {
          tile.innerHTML = content;
        }

        if (rotation !== 0) {
          tile.style.transform = `rotate(${rotation}deg)`;
        }
        return tile;
      }

      function drawMap({ map, rotations }) {
        const container = document.getElementById("map-container");
        container.innerHTML = ""; // Clear previous content before drawing
        container.style.gridTemplateColumns = `repeat(${MAP_WIDTH}, ${TILE_SIZE}px)`;
        container.style.gridTemplateRows = `repeat(${MAP_HEIGHT}, ${TILE_SIZE}px)`;

        // Create tiles
        for (let y = 0; y < map.length; y++) {
          for (let x = 0; x < map[0].length; x++) {
            const terrainValue = map[y][x];
            const rotation = rotations ? rotations[y][x] : 0;
            let tileType;

            // Determine terrain type
            // 0 = plains, 1 = forest, 2 = mountains, 3 = river, 4 = ruins
            switch (terrainValue) {
              case 1:
                tileType = "forest";
                break;
              case 2:
                tileType = "mountains";
                break;
              case 3:
                tileType = "river";
                break;
              case 4:
                tileType = "ruins";
                break;
              default:
                tileType = "plains";
            }

            const tile = createTile(tileType, "", rotation);
            container.appendChild(tile);
          }
        }
      }

      // Generate and draw
      // Get seed from URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const seedParam = urlParams.get("seed");
      const seed = seedParam ? parseInt(seedParam) : null;

      const result = generateMap(MAP_WIDTH, MAP_HEIGHT, seed);
      drawMap(result);

      // Helper function to update URL with current parameters
      function updateURL() {
        const params = new URLSearchParams();
        params.set("seed", result.seed);
        const newURL = `${window.location.pathname}?${params.toString()}`;
        window.history.replaceState({}, "", newURL);
      }

      // Display the seed on the page
      const seedLabel = document.getElementById("seed-label");
      seedLabel.textContent = `Seed: ${result.seed}`;

      // Add click handler to new map button
      const newMapBtn = document.getElementById("new-map-btn");
      newMapBtn.addEventListener("click", () => {
        const newSeed = Math.floor(Math.random() * 1000000);
        window.location.href = `${window.location.pathname}?seed=${newSeed}`;
      });

      // Add click handler to screenshot button
      const screenshotBtn = document.getElementById("screenshot-btn");
      screenshotBtn.addEventListener("click", async () => {
        const gameContainer = document.getElementById("game-container");
        const originalText = screenshotBtn.textContent;

        screenshotBtn.textContent = "Generating...";

        try {
          // Allow UI to update before starting heavy operation (allows "Generating..." to show)
          await new Promise((resolve) => setTimeout(resolve, 0));

          // Use dom-to-image-more to capture the game-container (better SVG support)
          const blob = await domtoimage.toBlob(gameContainer, {
            bgcolor: "#ffffff",
            width: gameContainer.offsetWidth * SCREENSHOT_SCALE,
            height: gameContainer.offsetHeight * SCREENSHOT_SCALE,
            style: {
              transform: `scale(${SCREENSHOT_SCALE})`,
              transformOrigin: "top left",
              width: gameContainer.offsetWidth + "px",
              height: gameContainer.offsetHeight + "px",
            },
          });

          // Convert blob to download link
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = `terrain-map-seed-${result.seed}.png`;
          link.click();
          URL.revokeObjectURL(url);

          screenshotBtn.textContent = "Downloaded!";
          setTimeout(() => {
            screenshotBtn.textContent = originalText;
          }, 1500);
        } catch (err) {
          console.error("Failed to capture screenshot:", err);
          screenshotBtn.textContent = "Error!";
          setTimeout(() => {
            screenshotBtn.textContent = originalText;
          }, 1500);
        }
      });

      // Set initial URL with parameters
      updateURL();
    </script>
  </body>
</html>
