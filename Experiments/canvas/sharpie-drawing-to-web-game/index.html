<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sharpie Adventure</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        line-height: 1.5;
      }
      body {
        padding: 20px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      main {
        width: 800px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      ul {
        padding-left: 20px;
      }
      .canvas_wrap {
        position: relative;
      }
      header {
        display: flex;
        justify-content: space-between;
        font-weight: bold;
      }
      canvas {
        width: 100%;
        border: 2px solid #000;
        border-radius: 6px;
      }
      input[type="file"] {
        position: absolute;
        top: 10px;
        left: 10px;
        color: transparent;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- <h1>Sharpie Adventure</h1>
    <ul>
      <li>Draw your own adventure (black sharpie on white paper works best).</li>
      <li>Then snap a photo and load it here to play!</li>
    </ul> -->

      <header>
        <p>Sharpie Adventure</p>
        <p id="bombCount"></p>
      </header>
      <div class="canvas_wrap">
        <input type="file" id="imageInput" accept="image/*" />
        <canvas id="outputCanvas"></canvas>
      </div>
    </main>

    <script>
      // Global variables
      const MAP_SIZE = 800;
      const PLAYER_INITIAL_POS = { x: 40, y: 40 };
      const BOMB_INITIAL_FUSE = 10;

      let mapData;

      let player = { ...PLAYER_INITIAL_POS, size: 10, speed: 7 };

      let bomb = {
        x: 0,
        y: 0,
        size: 5,
        fuse: BOMB_INITIAL_FUSE,
        blastSize: 80,
        isPlaced: false,
        count: 4,
      };

      let itemBombsList = [];

      let goal = {
        x: null,
        y: null,
        size: 5,
      };

      // Global Elements
      const imageInput = document.getElementById("imageInput");
      const canvas = document.getElementById("outputCanvas");
      const bombCountEl = document.getElementById("bombCount");

      imageInput.addEventListener("change", handleImage);

      canvas.width = MAP_SIZE;
      canvas.height = MAP_SIZE;
      const ctx = canvas.getContext("2d");

      bombCountEl.innerText = `Bombs: ${bomb.count}`;

      const audioPickupItem = new Audio("./sfx/pickup_item.wav");
      const audioPlaceBomb = new Audio("./sfx/place_bomb.wav");
      const audioExplodeBomb = new Audio("./sfx/explode_bomb.wav");
      const audioGoal = new Audio("./sfx/goal.wav");

      function handleImage(event) {
        const input = event.target;
        if (input.files && input.files[0]) {
          const reader = new FileReader();

          reader.onload = function (e) {
            const img = new Image();
            img.src = e.target.result;

            img.onload = function () {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

              // Store map data
              mapData = ctx.getImageData(
                0,
                0,
                canvas.width,
                canvas.height,
              ).data;

              const grayscaleColors = [
                [0, 0, 0, 255], // Black
                [255, 255, 255, 255], // White
              ];

              // First pass: identify red pixels and blue goal
              const redPixels = new Set();
              for (let i = 0; i < mapData.length; i += 4) {
                let colorIndex;

                // Get lightness value of the current pixel
                const lightness =
                  (mapData[i] + mapData[i + 1] + mapData[i + 2]) / 3;

                lightness > 90 ? (colorIndex = 1) : (colorIndex = 0);

                if (checkIsBlue(mapData, i)) {
                  // set goal position to be the center of the blue pixel
                  goal.x = Math.floor((i / 4) % MAP_SIZE);
                  goal.y = Math.floor(i / 4 / MAP_SIZE);

                  // set pixel to be white
                  mapData[i] = 255;
                  mapData[i + 1] = 255;
                  mapData[i + 2] = 255;
                  mapData[i + 3] = 255;
                } else if (checkIsRed(mapData, i)) {
                  // Track red pixels for flood fill
                  redPixels.add(i / 4);

                  // set pixel to be white
                  mapData[i] = 255;
                  mapData[i + 1] = 255;
                  mapData[i + 2] = 255;
                  mapData[i + 3] = 255;
                } else {
                  // Pixels should be set to either white or black based on lightness
                  mapData[i] = grayscaleColors[colorIndex][0];
                  mapData[i + 1] = grayscaleColors[colorIndex][1];
                  mapData[i + 2] = grayscaleColors[colorIndex][2];
                  mapData[i + 3] = grayscaleColors[colorIndex][3];
                }
              }

              // Second pass: find contiguous red regions and create bomb items
              itemBombsList = [];
              const visitedRedPixels = new Set();
              redPixels.forEach((pixelPos) => {
                if (!visitedRedPixels.has(pixelPos)) {
                  const bomb = floodFillRed(redPixels, pixelPos * 4);
                  itemBombsList.push(bomb);
                  // Mark all pixels in this region as visited
                  // (floodFillRed will have found them)
                }
              });

              // Filter out bombs that are within 8 pixels of each other
              itemBombsList = itemBombsList.filter((bomb, idx) => {
                for (let i = 0; i < idx; i++) {
                  const dx = bomb.x - itemBombsList[i].x;
                  const dy = bomb.y - itemBombsList[i].y;
                  const distance = Math.sqrt(dx * dx + dy * dy);
                  if (distance < 8) {
                    return false; // Skip this bomb
                  }
                }
                return true;
              });

              // Render player
              renderMap();
              renderPlayer();
              renderItem();
              renderGoal();
            };
          };

          reader.readAsDataURL(input.files[0]);
        }
      }

      function checkIsRed(mapData, i) {
        if (
          mapData[i] > 100 &&
          mapData[i] < 220 &&
          mapData[i + 1] < 80 &&
          mapData[i + 2] < 90
        ) {
          return true;
        }
        return false;
      }

      function floodFillRed(redPixels, startIdx) {
        // Find all connected red pixels using flood fill
        const visited = new Set();
        const queue = [startIdx];
        const connectedPixels = [];

        while (queue.length > 0) {
          const pixelIdx = queue.shift();
          if (visited.has(pixelIdx)) continue;
          visited.add(pixelIdx);
          connectedPixels.push(pixelIdx);

          // Check 4-connected neighbors
          const pixelPos = pixelIdx / 4;
          const x = pixelPos % MAP_SIZE;
          const y = Math.floor(pixelPos / MAP_SIZE);

          const neighbors = [
            (y - 1) * MAP_SIZE + x, // up
            (y + 1) * MAP_SIZE + x, // down
            y * MAP_SIZE + (x - 1), // left
            y * MAP_SIZE + (x + 1), // right
          ];

          neighbors.forEach((neighborPos) => {
            const neighborIdx = neighborPos * 4;
            if (
              neighborIdx >= 0 &&
              neighborIdx < mapData.length &&
              redPixels.has(neighborPos)
            ) {
              if (!visited.has(neighborIdx)) {
                queue.push(neighborIdx);
              }
            }
          });
        }

        // Calculate center of connected region
        let sumX = 0,
          sumY = 0;
        connectedPixels.forEach((pixelIdx) => {
          const pixelPos = pixelIdx / 4;
          sumX += pixelPos % MAP_SIZE;
          sumY += Math.floor(pixelPos / MAP_SIZE);
        });

        return {
          x: Math.round(sumX / connectedPixels.length),
          y: Math.round(sumY / connectedPixels.length),
          size: 5,
          count: 2,
        };
      }

      function checkIsBlue(mapData, i) {
        if (
          mapData[i] < 60 &&
          mapData[i + 1] > 60 &&
          mapData[i + 1] < 160 &&
          mapData[i + 2] > 140
        ) {
          return true;
        }
        return false;
      }

      function renderMap() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.putImageData(
          new ImageData(mapData, canvas.width, canvas.height),
          0,
          0,
        );
      }

      function renderPlayer() {
        ctx.fillStyle = "mediumseagreen";
        ctx.fillRect(player.x, player.y, player.size, player.size);
      }

      function renderItem() {
        itemBombsList.forEach((item) => {
          ctx.fillStyle = "red";
          ctx.fillRect(item.x, item.y, item.size, item.size);
        });
      }

      function renderGoal() {
        if (goal.x === null) {
          return;
        }
        ctx.fillStyle = "deepskyblue";
        ctx.fillRect(goal.x, goal.y, goal.size, goal.size);
      }

      function renderBomb() {
        ctx.fillStyle = "red";
        ctx.fillRect(bomb.x, bomb.y, bomb.size, bomb.size);
      }

      function explodeBomb() {
        bomb.isPlaced = false;

        audioExplodeBomb.play();

        // Calculate bomb explosion area
        const halfBlastSize = Math.floor(bomb.blastSize / 2);
        const explosionXArea = [...Array(bomb.blastSize)].map(
          (_, i) => bomb.x - halfBlastSize + i,
        );
        const explosionYArea = [...Array(bomb.blastSize)].map(
          (_, i) => (bomb.y - halfBlastSize + i) * MAP_SIZE,
        );

        // Update map data
        explosionYArea.forEach((y) => {
          explosionXArea.forEach((x) => {
            const pixelInExplosion = (y + x) * 4;

            // if explosion pixel is touching player
            if (pixelInExplosion === (player.y * MAP_SIZE + player.x) * 4) {
              // reset player
              player.x = PLAYER_INITIAL_POS.x;
              player.y = PLAYER_INITIAL_POS.y;
            }

            mapData[pixelInExplosion] = 255;
            mapData[pixelInExplosion + 1] = 255;
            mapData[pixelInExplosion + 2] = 255;
            mapData[pixelInExplosion + 3] = 255;
          });
        });

        // Redraw the map and player
        renderMap();
        renderPlayer();
        renderItem();
        renderGoal();
      }

      function movePlayer(direction) {
        const dx =
          direction === "right"
            ? player.speed
            : direction === "left"
              ? -player.speed
              : 0;
        const dy =
          direction === "down"
            ? player.speed
            : direction === "up"
              ? -player.speed
              : 0;

        // Calculate next player position
        const nextXArea = [...Array(player.size)].map(
          (_, i) => player.x + i + dx,
        );
        const nextYArea = [...Array(player.size)].map(
          (_, i) => (player.y + i + dy) * MAP_SIZE,
        );

        let isWall = false;
        let isItem = false;

        // check if next position is outside the canvas
        if (player.x + dx < 0 || player.x + dx + 5 > MAP_SIZE) {
          return;
        }
        if (player.y + dy < 0 || player.y + dy + 5 > MAP_SIZE) {
          return;
        }

        // Check if the next position intersects with...
        nextYArea.forEach((y) => {
          nextXArea.forEach((x) => {
            const pixelInPlayer = (y + x) * 4;
            // a wall
            if (mapData[pixelInPlayer] === 0) {
              isWall = true;
            }
            // an item
            itemBombsList.forEach((item, idx) => {
              if (pixelInPlayer === (item.y * MAP_SIZE + item.x) * 4) {
                isItem = idx; // Store the index of the item
              }
            });
            // if player is touching goal
            if (pixelInPlayer === (goal.y * MAP_SIZE + goal.x) * 4) {
              audioGoal.play();
              window.location = "raycast://extensions/raycast/raycast/confetti";
              setTimeout(() => alert("You win!"), 1000);
            }
          });
        });

        if (isWall) {
          return;
        }

        // Update player position
        player.x += dx;
        player.y += dy;

        // Redraw the map and player
        renderMap();
        renderItem();
        renderPlayer();
        renderGoal();

        if (isItem !== false) {
          audioPickupItem.play();

          bomb.count = bomb.count + itemBombsList[isItem].count;
          bombCountEl.innerText = `Bombs: ${bomb.count}`;
          itemBombsList.splice(isItem, 1);
          renderItem();
        }

        if (bomb.isPlaced) {
          renderBomb();
          // Explode bomb after 10 steps
          if (bomb.fuse === 0) {
            explodeBomb();
            bomb.fuse = BOMB_INITIAL_FUSE;
          } else {
            bomb.fuse = bomb.fuse - 1;
          }
        }
      }

      function placeBomb() {
        if (bomb.count === 0) {
          return;
        }
        if (bomb.isPlaced) {
          return;
        }

        audioPlaceBomb.play();

        bomb.x = player.x;
        bomb.y = player.y;
        bomb.isPlaced = true;
        bomb.count = bomb.count - 1;
        bombCountEl.innerText = `Bombs: ${bomb.count}`;

        // Redraw the map and player
        renderMap();
        renderPlayer();
        renderBomb();
        renderItem();
        renderGoal();
      }

      // Handle player movement with arrow keys
      document.addEventListener("keydown", function (event) {
        if (event.key === "ArrowRight") movePlayer("right");
        else if (event.key === "ArrowLeft") movePlayer("left");
        else if (event.key === "ArrowDown") movePlayer("down");
        else if (event.key === "ArrowUp") movePlayer("up");
        else if (event.key === "b") placeBomb();
      });
    </script>
  </body>
</html>
